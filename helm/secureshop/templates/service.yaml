apiVersion: v1
kind: Service
metadata:
  name: secureshop
  namespace: secureshop
  labels:
    {{- include "secureshop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "secureshop.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
