# US-048: Alertmanager alert rules (PrometheusRule CRD)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secureshop-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: secureshop.rules
      rules:
        - alert: SecureShopHighErrorRate
          expr: >
            sum(rate(http_server_requests_seconds_count{application="secureshop",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="secureshop"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SecureShop 5xx error rate above 5%"
            description: "More than 5% of requests to SecureShop have returned 5xx over the last 5 minutes."

        - alert: SecureShopPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="secureshop"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SecureShop pod is crash-looping"
            description: "Pod {{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

        - alert: SecureShopHighMemoryUsage
          expr: >
            sum(container_memory_working_set_bytes{namespace="secureshop"}) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="secureshop", resource="memory"}) by (pod) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SecureShop pod memory usage above 90% of limit"
