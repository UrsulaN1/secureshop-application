# US-046: Deploy Prometheus (via kube-prometheus-stack, which also bundles Alertmanager US-048/US-049)
prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 1Gi }

alertmanager:
  config:
    route:
      receiver: slack-notifications
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - matchers: ["severity=critical"]
          receiver: slack-notifications
          continue: true
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL}"   # from a K8s secret, not committed to Git
            channel: "#secureshop-alerts"
            send_resolved: true
            title: "{{ .CommonAnnotations.summary }}"
            text: "{{ .CommonAnnotations.description }}"

grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"   # from Vault-backed secret, not committed
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc:80
      access: proxy
