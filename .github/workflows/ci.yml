# US-013/US-014: CI workflow triggered on PRs and main branch pushes
# US-053: complete application security pipeline integrated into GitHub Actions
# US-055: Terraform / IaC security validation integrated into CI
name: CI - Build, Test, Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------
  # US-016: GitGuardian secret scanning - runs first, blocks everything else
  # ---------------------------------------------------------------------
  secret-scan:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # ---------------------------------------------------------------------
  # US-011/US-012: Maven build + JUnit tests
  # US-017: SonarQube quality/security gate
  # US-018: OWASP Dependency-Check
  # ---------------------------------------------------------------------
  build-test-scan:
    name: Build, Test & Application Security Scans
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for SonarQube blame/new-code analysis

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven build (compile)
        run: mvn -B -ntp clean compile

      - name: Run JUnit tests
        run: mvn -B -ntp test

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Results
          path: app/target/surefire-reports/*.xml
          reporter: java-junit

      - name: OWASP Dependency-Check
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DsuppressionFiles=../security/dependency-check-suppressions.xml

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: app/target/dependency-check-report.*
          retention-days: 30

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.projectKey=secureshop
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload build + test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            app/target/*.jar
            app/target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------------------
  # US-055: Terraform validation + Checkov IaC scanning
  # ---------------------------------------------------------------------
  terraform-security:
    name: Terraform Validate & Checkov Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Checkov IaC scan (US-009)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: security/checkov/.checkov.yaml
          quiet: true
          soft_fail: false   # high/critical findings fail the pipeline per security policy

  # ---------------------------------------------------------------------
  # Gate: everything above must pass before the pipeline is considered green
  # ---------------------------------------------------------------------
  ci-summary:
    name: CI Security Gate Summary
    needs: [secret-scan, build-test-scan, terraform-security]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI security gates passed."
