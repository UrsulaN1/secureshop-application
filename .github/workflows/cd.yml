# US-054: complete container supply-chain pipeline (build -> scan -> SBOM -> sign -> push)
# US-056: end-to-end GitOps release
# Runs only after ci.yml succeeds on main (see US-014: main triggers the complete CI process)
name: CD - Container Build, Sign & GitOps Release

on:
  workflow_run:
    workflows: ["CI - Build, Test, Security Gates"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write        # needed for OIDC auth to AWS + keyless Cosign signing
  packages: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: secureshop
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-sign-push:
    name: Build, Scan, SBOM, Sign, Push to ECR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # US-020/US-021: build hardened image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f app/Dockerfile ./app

      # US-022: Trivy container scan - critical vulns block release
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

      # US-023: SBOM generation with Syft
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: secureshop-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: secureshop-sbom.cdx.json
          retention-days: 90

      # US-024: Cosign keyless image signing (after security validation)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image to ECR
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Sign image with Cosign (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@$(
              docker inspect --format='{{index .RepoDigests 0}}' \
              ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} | cut -d@ -f2
            )

      - name: Attach SBOM attestation to image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate secureshop-sbom.cdx.json --type cyclonedx \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # US-056: update GitOps repo so ArgoCD can pick up the new, signed, validated image
      - name: Update GitOps repository image tag
        uses: actions/checkout@v4
        with:
          repository: secureshop-org/secureshop-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops-repo

      - name: Bump image tag in Helm values (dev overlay)
        run: |
          cd gitops-repo
          sed -i "s/tag:.*/tag: \"${{ env.IMAGE_TAG }}\"/" environments/dev/values.yaml
          git config user.name "secureshop-ci-bot"
          git config user.email "ci-bot@secureshop.local"
          git commit -am "ci: deploy secureshop image ${{ env.IMAGE_TAG }} to dev [skip ci]"
          git push

      - name: Slack notification (US-004, US-049)
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "SecureShop CD ${{ job.status }} for commit ${{ env.IMAGE_TAG }} - image pushed to ECR and GitOps repo updated."
            }
