apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secureshop-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/secureshop-org/secureshop-gitops.git
    targetRevision: main
    path: helm/secureshop
    helm:
      valueFiles: [values.yaml, environments/staging/values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: secureshop
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
