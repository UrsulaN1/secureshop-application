apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: secureshop, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/REPLACE_ORG/REPLACE_GITOPS_REPO.git, targetRevision: main, path: helm/secureshop}
  destination: {server: https://kubernetes.default.svc, namespace: default}
  syncPolicy: {automated: {prune: true, selfHeal: true}}
